---
# Check if Container already exists
- name: Get infos on container
  community.docker.docker_container_info:
    name: traefik
  register: traefik_result

# Prepare files and directories
- name: Create traefik directory with parent directories
  ansible.builtin.file:
    path: "{{ docker_traefik_path }}/config/dynamic/"
    state: directory
    owner: "{{ docker_traefik_dynamic_user }}"
    group: "{{ docker_traefik_dynamic_group }}"
    recurse: true

- name: Create data directory with parent directories
  ansible.builtin.file:
    path: "{{ docker_traefik_path }}/data/"
    state: directory
    owner: "{{ docker_traefik_dynamic_user }}"
    group: "{{ docker_traefik_dynamic_group }}"
    recurse: true

- name: Create acme.json with correct permissions
  ansible.builtin.file:
    path: "{{ docker_traefik_path }}/data/acme.json"
    state: touch
    owner: "{{ docker_traefik_dynamic_user }}"
    group: "{{ docker_traefik_dynamic_group }}"
    mode: "0600"
    access_time: preserve
    modification_time: preserve

- name: Create access log directory
  ansible.builtin.file:
    path: "{{ docker_traefik_path }}/logs/"
    state: directory
    owner: "{{ docker_traefik_dynamic_user }}"
    group: "{{ docker_traefik_dynamic_group }}"
    mode: "0750"
  when: docker_traefik_accesslog_retention_days | int > 0

- name: Install logrotate
  ansible.builtin.package:
    name: logrotate
    state: present
  when: docker_traefik_accesslog_retention_days | int > 0

- name: Configure logrotate for traefik access log
  ansible.builtin.copy:
    dest: /etc/logrotate.d/traefik
    owner: root
    group: root
    mode: "0644"
    content: |
      {{ docker_traefik_path }}/logs/access.log {
        daily
        rotate {{ docker_traefik_accesslog_retention_days }}
        maxage {{ docker_traefik_accesslog_retention_days }}
        missingok
        notifempty
        compress
        delaycompress
        postrotate
          docker kill --signal=USR1 traefik >/dev/null 2>&1 || true
        endscript
      }
  when: docker_traefik_accesslog_retention_days | int > 0

- name: Remove logrotate config for traefik access log
  ansible.builtin.file:
    path: /etc/logrotate.d/traefik
    state: absent
  when: docker_traefik_accesslog_retention_days | int == 0

# copy configuration
- name: Generate and copy traefik.yml
  ansible.builtin.template:
    src: "traefik/traefik.yml.j2"
    dest: "{{ docker_traefik_path }}/config/traefik.yml"
    owner: "{{ docker_traefik_dynamic_user }}"
    group: "{{ docker_traefik_dynamic_group }}"
    mode: "0644"
  diff: true
  notify: Restart Traefik  # static config is only read on startup

- name: Generate and copy default.yml
  ansible.builtin.template:
    src: "traefik/default.yml.j2"
    dest: "{{ docker_traefik_path }}/config/dynamic/default.yml"
    owner: "{{ docker_traefik_dynamic_user }}"
    group: "{{ docker_traefik_dynamic_group }}"
    mode: "0644"
  diff: true

- name: Generate and copy additional non docker services
  ansible.builtin.template:
    src: "traefik/service.yml.j2"
    dest: "{{ docker_traefik_path }}/config/dynamic/{{ service_item.name }}.yml"
    owner: "{{ docker_traefik_dynamic_user }}"
    group: "{{ docker_traefik_dynamic_group }}"
    mode: "0644"
  with_items: "{{ docker_traefik_non_docker_services }}"
  loop_control:
    label: "{{ service_item.name }}"
    loop_var: "service_item"

# start traefik
- name: Start Traefik
  community.docker.docker_container:
    name: traefik
    image: "traefik:{{ docker_traefik_version }}"
    userns_mode: "host"
    pull: true
    state: started
    restart: "{{ docker_traefik_force_restart }}"
    restart_policy: always
    comparisons:
      "*": strict
      networks: allow_more_present
    networks: "{{ _docker_traefik_networks }}"
    # purge_networks: true
    ports: "{{ _docker_traefik_ports }}"
    volumes: "{{ _docker_traefik_volumes }}"
    labels: "{{ _docker_traefik_labels }}"
    env: "{{ docker_traefik_custom_environment }}"
    healthcheck:
      test: "traefik healthcheck --ping | grep 'OK'"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
