---
# tasks file for fw-docker-stack
- name: Check for renamed or removed variables
  ansible.builtin.assert:
    that: _docker_stack_obsolete_vars_set | length == 0
    fail_msg: >-
      Obsolete variables, please migrate:
      {% for var in _docker_stack_obsolete_vars_set %}{{ var.key }} -> {{ var.value }}; {% endfor %}
    quiet: true

- name: Check dependent variables
  ansible.builtin.assert:
    that:
      - not docker_traefik_enable_acme | bool or docker_traefik_acme_mail | length > 0
      - not docker_traefik_dns_challenge | bool or docker_traefik_dns_provider | length > 0
      - not docker_traefik_enable_stored_certs | bool or docker_traefik_enable_acme | bool
        or (docker_traefik_certs_crt_file | length > 0 and docker_traefik_certs_key_file | length > 0)
      - not docker_traefik_dashboard_enable | bool or docker_traefik_api_enable | bool
    fail_msg: >-
      docker_traefik_enable_acme needs docker_traefik_acme_mail, docker_traefik_dns_challenge needs
      docker_traefik_dns_provider, docker_traefik_enable_stored_certs needs docker_traefik_certs_crt_file
      and docker_traefik_certs_key_file, docker_traefik_dashboard_enable needs docker_traefik_api_enable
    quiet: true
  when: docker_install_traefik | bool

- name: Ensure docker is running
  ansible.builtin.service:
    name: docker
    state: started

- name: Create Proxy Network
  community.docker.docker_network:
    name: "{{ docker_traefik_network_name }}"
    enable_ipv6: "{{ docker_traefik_network_enable_ipv6 }}"
  when: docker_install_traefik | bool

- name: Login into private registry
  ansible.builtin.include_tasks: docker-login.yml
  loop: "{{ docker_logins }}"
  loop_control:
    label: "{{ item.docker_registry_url }}"

- name: Start Traefik
  ansible.builtin.include_tasks: docker-traefik.yml
  when: docker_install_traefik | bool

- name: Start Watchtower
  ansible.builtin.include_tasks: docker-watchtower.yml
  when: docker_install_watchtower | bool

- name: Start Portainer
  ansible.builtin.include_tasks: docker-portainer.yml
  when: docker_install_portainer | bool

- name: Start Portainer Agent
  ansible.builtin.include_tasks: docker-portainer-agent.yml
  when: docker_install_portainer_agent | bool
